<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table,
        td {
            width: 200px;
            border : 1px solid #000000;
            text-align: center;
        }
        table{
            border-collapse: collapse;
            border-bottom: dashed;
            border-top: dashed;
            border-bottom-color: red;
            border-top-color: red;
        }


    </style>
    <meta charset="UTF-8">
    <title>Практична 3</title>
</head>
<body>
<table>
    <tbody>
    <tr>
        <td style = "background-color: #ff6868" >1</td>
        <td style = "background-color: #ff6868" >2</td>
        <td style = "background-color: #ff6868" >3</td>
        <td style = "background-color: #ff6868" >4</td>
    </tr>
    <tr>
        <td style = "background-color: #ff6868">5</td>
        <td style = "background-color: lightblue" rowspan="2">6</td>
        <td style = "background-color: #ff6868">7</td>
        <td style = "background-color: #ff6868">8</td>
    </tr>
    <tr>
        <td style = "background-color: #ff6868">9</td>
        <td style = "background-color: #ff6868">11</td>
        <td style = "background-color: #ff6868">12</td>
    </tr>
    <tr>
        <td style = "background-color: #ff6868">13</td>
        <td style = "background-color: red">14</td>
        <td style = "background-color: #ff6868">15</td>
        <td style = "background-color: #ff6868">16</td>
    </tr>
    <tr>
        <td style = "background-color: #ff6868">17</td>
        <td style = "background-color: red">18</td>
        <td style = "background-color: #ff6868">19</td>
        <td style = "background-color: #ff6868">20</td>
    </tr>
    <tr>
        <td style = "background-color: #ff6868">21</td>
        <td style = "background-color: red">22</td>
        <td style = "background-color: #ff6868">23</td>
        <td style = "background-color: #ff6868">24</td>
    </tr>
    <tr>
        <td style = "background-color: #ff6868">25</td>
        <td style = "background-color: lightgreen" colspan="3">26</td>
    </tr>
    <tr>
        <td style = "background-color: #ff6868">29</td>
        <td style = "background-color:lightblue">30</td>
        <td style = "background-color:lightblue">31</td>
        <td style = "background-color:lightblue">32</td>
    </tr>
    </tbody>

</table>
</body>
</html>
